name: Deploy — Linux (bot + dashboard)

# Runs automatically after CI passes on a push to main, then WAITS for an
# approval click on the "production" Environment (required reviewers) — approve
# only when no trade is in a sensitive state. Can also be run by hand from the
# Actions tab. SSHes into the VPS, fast-forwards to the CI-tested commit,
# rebuilds the telebot container, and health-checks /health. Shared
# postgres/nginx are never touched. Deploying the bot restarts the Telegram
# listener for a few seconds; the bot reconnects and reconciles broker state on
# startup.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm the book is in a safe state'
        required: true
        default: ''

# One deploy at a time; a newer pending deploy supersedes an older one.
concurrency:
  group: deploy-linux
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Linux VPS
    # workflow_run: only green CI from a push to THIS repo's main. The
    # head_repository check stops a fork PR from a branch named "main" from
    # triggering a deploy.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'deploy')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.LINUX_SSH_KEY }}
          SSH_HOST: ${{ secrets.LINUX_SSH_HOST }}
          SSH_USER: ${{ secrets.LINUX_SSH_USER }}
          APP_DIR: ${{ vars.LINUX_APP_DIR }}
          # Deploy exactly the commit CI tested, not whatever main is now.
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy \
            "$SSH_USER@$SSH_HOST" \
            "APP_DIR='${APP_DIR:-/home/murx/apps/telebot}' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          echo "==> Updating to $DEPLOY_SHA"
          git fetch --prune origin
          git checkout main
          git merge --ff-only "$DEPLOY_SHA"

          echo "==> Rebuilding + restarting telebot"
          docker compose up -d --build telebot

          echo "==> Health check (/health, in-container — no host port is published)"
          ok=0
          for i in $(seq 1 20); do
            if docker compose exec -T telebot python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status==200 else 1)" 2>/dev/null; then
              echo "health OK (attempt $i)"; ok=1; break
            fi
            sleep 3
          done
          if [ "$ok" -ne 1 ]; then
            echo "!! health check FAILED — recent logs:"
            docker compose logs --tail=80 telebot
            exit 1
          fi
          echo "==> Deploy complete"
          REMOTE
